# The OSO shared run, step 2 of 2: record checked submissions. Trusted: runs the base branch's code only.
# scripts/shared-apply.sh records every checked pull request still open (see there why all of them, not one).
# Started by each finished check, and every 30 minutes as a safety net.
name: Shared run apply
on:
  workflow_run:
    workflows: ['Shared run check']
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
concurrency:
  group: shared-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply every checked pull request still open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --ignore-scripts
          sh scripts/shared-apply.sh
